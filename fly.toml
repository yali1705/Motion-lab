# Fly.io configuration for Motion Lab (editor + API + Remotion renderer in one machine).
# The app name is overridden by `flyctl deploy --app <name>` (see scripts/deploy-fly.sh).
app = "motion-lab"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"
  MOTION_LAB_DATA_DIR = "/data"
  MOTION_LAB_CONCURRENCY = "2"
  MOTION_LAB_MAX_FRAMES = "1800"
  MOTION_LAB_MAX_PENDING = "4"
  MOTION_LAB_RETENTION_DAYS = "7"

# Render jobs and MP4s persist here across deploys and restarts.
[mounts]
  source = "motion_lab_data"
  destination = "/data"

[http_service]
  internal_port = 3001
  force_https = true
  # Keep one machine up so renders are never interrupted by auto-stop.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/api/health"

# Chromium needs memory while rendering 1080×1920 frames.
[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
